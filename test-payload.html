<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kyou Embed Payload Tester</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; color: #0f172a; }
    h1 { margin: 0 0 12px; font-size: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
    .panel { border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .field { display: grid; gap: 6px; margin-bottom: 10px; }
    label { font-size: 12px; font-weight: 700; }
    input, textarea, select { font: inherit; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; }
    textarea { min-height: 80px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button { border: 1px solid #0f172a; border-radius: 8px; background: #0f172a; color: #fff; padding: 8px 10px; cursor: pointer; }
    button.secondary { background: #fff; color: #0f172a; }
    .out { background: #020617; color: #e2e8f0; border-radius: 8px; padding: 10px; white-space: pre-wrap; overflow: auto; max-height: 240px; font-size: 12px; }
    #widgetSlot { min-height: 280px; }
  </style>
</head>
<body>
  <h1>Kyou Embed Payload Tester</h1>
  <div class="grid">
    <main>
      <div class="panel">
        <div class="field">
          <label for="articleId">Article ID</label>
          <input id="articleId" value="sim-001" />
        </div>
        <div class="field">
          <label for="context">Context</label>
          <input id="context" value="news" />
        </div>
        <div class="field">
          <label for="title">Article Title</label>
          <input id="title" value="Kaori x Kyou integration test" />
        </div>
        <div class="field">
          <label for="tags">Tags (comma-separated)</label>
          <input id="tags" value="mono goods, figure, anime" />
        </div>
        <div class="field">
          <label for="category">Category</label>
          <input id="category" value="otaku-lifestyle" />
        </div>
      </div>

      <div class="panel">
        <div class="field">
          <label for="kaoriBase">Kaori API Base</label>
          <input id="kaoriBase" placeholder="https://api.kaori.com" />
        </div>
        <div class="field">
          <label for="kaoriPath">Kaori Article Path</label>
          <input id="kaoriPath" value="/articles/{id}" />
        </div>
        <div class="field">
          <label for="kyouBase">Kyou/Mitsuha API Base</label>
          <input id="kyouBase" value="https://search.kyou.id/v1/search" />
        </div>
        <div class="field">
          <label for="kyouMode">Kyou Mode</label>
          <select id="kyouMode">
            <option value="mitsuha-search" selected>mitsuha-search (GET)</option>
            <option value="recommendation">recommendation (POST)</option>
          </select>
        </div>
        <div class="field">
          <label for="kyouSearchPath">Search Path (mitsuha-search)</label>
          <input id="kyouSearchPath" value="" placeholder="Leave empty when base already ends with /search" />
        </div>
        <div class="field">
          <label for="kyouRecommendPath">Recommend Path (recommendation)</label>
          <input id="kyouRecommendPath" value="/recommendations" />
        </div>
        <div class="field">
          <label for="apiKey">Bearer API Key (optional)</label>
          <input id="apiKey" />
        </div>

        <div class="row">
          <button id="buildPayloadBtn" type="button">Build Payload</button>
          <button id="callKaoriBtn" type="button" class="secondary">Call Kaori</button>
          <button id="callKyouBtn" type="button" class="secondary">Call Kyou</button>
          <button id="loadWidgetBtn" type="button">Load Widget</button>
        </div>
      </div>

      <div class="panel">
        <label>Payload to Kyou</label>
        <pre id="payloadOut" class="out"></pre>
      </div>
      <div class="panel">
        <label>Kaori Response</label>
        <pre id="kaoriOut" class="out"></pre>
      </div>
      <div class="panel">
        <label>Kyou Response</label>
        <pre id="kyouOut" class="out"></pre>
      </div>
    </main>

    <aside>
      <div class="panel">
        <strong>Widget Preview (280x280)</strong>
        <div id="widgetSlot" style="margin-top:8px;"></div>
      </div>
    </aside>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const payloadOut = $("payloadOut");
    const kaoriOut = $("kaoriOut");
    const kyouOut = $("kyouOut");

    function readState() {
      const tagsRaw = $("tags").value || "";
      const tags = tagsRaw.split(",").map((x) => x.trim()).filter(Boolean);
      return {
        articleId: $("articleId").value.trim(),
        context: $("context").value.trim(),
        title: $("title").value.trim(),
        tags,
        category: $("category").value.trim(),
        kaoriBase: $("kaoriBase").value.trim(),
        kaoriPath: $("kaoriPath").value.trim(),
        kyouBase: $("kyouBase").value.trim(),
        kyouMode: $("kyouMode").value.trim(),
        kyouSearchPath: $("kyouSearchPath").value,
        kyouRecommendPath: $("kyouRecommendPath").value.trim(),
        apiKey: $("apiKey").value.trim(),
      };
    }

    function buildPayload(s) {
      return {
        articleId: s.articleId,
        context: s.context,
        title: s.title,
        tags: s.tags,
        category: s.category,
      };
    }

    function setOut(el, value) {
      el.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    }

    async function callJson(url, init = {}) {
      const res = await fetch(url, init);
      const text = await res.text();
      let parsed = text;
      try { parsed = JSON.parse(text); } catch (_) {}
      return { ok: res.ok, status: res.status, data: parsed };
    }

    $("buildPayloadBtn").addEventListener("click", () => {
      const s = readState();
      setOut(payloadOut, buildPayload(s));
    });

    $("callKaoriBtn").addEventListener("click", async () => {
      const s = readState();
      if (!s.kaoriBase) return setOut(kaoriOut, "Missing Kaori API Base");
      const path = (s.kaoriPath || "/articles/{id}").replace("{id}", encodeURIComponent(s.articleId));
      const url = s.kaoriBase.replace(/\/$/, "") + path;
      const headers = s.apiKey ? { Authorization: `Bearer ${s.apiKey}` } : {};
      setOut(kaoriOut, "Loading...");
      try {
        const result = await callJson(url, { method: "GET", headers });
        setOut(kaoriOut, result);
      } catch (err) {
        setOut(kaoriOut, String(err));
      }
    });

    $("callKyouBtn").addEventListener("click", async () => {
      const s = readState();
      if (!s.kyouBase) return setOut(kyouOut, "Missing Kyou API Base");
      const payload = buildPayload(s);
      const headers = s.apiKey ? { Authorization: `Bearer ${s.apiKey}` } : {};
      setOut(payloadOut, payload);
      setOut(kyouOut, "Loading...");

      try {
        if (s.kyouMode === "mitsuha-search") {
          const query = payload.tags[0] || payload.title || payload.category || "";
          const params = new URLSearchParams({
            q: query,
            sort: "kyou_search_score",
            sold: "false",
            excludeFilters: "true",
            page: "1,12",
          });
          const url = s.kyouBase.replace(/\/$/, "") + (s.kyouSearchPath || "") + "?" + params.toString();
          const result = await callJson(url, { method: "GET", headers });
          setOut(kyouOut, { request: { method: "GET", url }, response: result });
          return;
        }

        const url = s.kyouBase.replace(/\/$/, "") + (s.kyouRecommendPath || "/recommendations");
        const result = await callJson(url, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...headers },
          body: JSON.stringify(payload),
        });
        setOut(kyouOut, { request: { method: "POST", url, payload }, response: result });
      } catch (err) {
        setOut(kyouOut, String(err));
      }
    });

    $("loadWidgetBtn").addEventListener("click", () => {
      const s = readState();
      setOut(payloadOut, buildPayload(s));

      document.title = s.title || "Kyou Embed Payload Tester";
      let metaKeywords = document.querySelector('meta[name="keywords"]');
      if (!metaKeywords) {
        metaKeywords = document.createElement("meta");
        metaKeywords.setAttribute("name", "keywords");
        document.head.appendChild(metaKeywords);
      }
      metaKeywords.setAttribute("content", s.tags.join(", "));

      const slot = $("widgetSlot");
      slot.innerHTML = "";

      const script = document.createElement("script");
      script.src = "./Kyou-Embed.js?v=" + Date.now();
      script.dataset.articleId = s.articleId;
      script.dataset.context = s.context;
      script.dataset.tags = s.tags.join(",");
      script.dataset.kaoriApiBase = s.kaoriBase;
      script.dataset.kaoriArticlePath = s.kaoriPath;
      script.dataset.kyouApiBase = s.kyouBase;
      script.dataset.kyouMode = s.kyouMode;
      script.dataset.kyouSearchPath = s.kyouSearchPath;
      script.dataset.kyouRecommendPath = s.kyouRecommendPath;
      script.dataset.widgetWidth = "280";
      script.dataset.widgetHeight = "280";
      script.dataset.maxItems = "3";
      if (s.apiKey) script.dataset.apiKey = s.apiKey;
      slot.appendChild(script);
    });

    $("buildPayloadBtn").click();
  </script>
</body>
</html>
